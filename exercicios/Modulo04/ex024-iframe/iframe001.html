<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframes</title>
    <style>
      body {
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
      }
      iframe {
        border: 0.2rem dashed rgb(150, 85, 255);
        border-radius: 15px;
        box-shadow: 1rem 1rem 1rem -1rem rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <h1>TESTANDO IFRAMES</h1>
    <p>
      Acessando o site do
      <iframe src="https://www.cursoemvideo.com" frameborder="0" height="300">
        <a href="http://www.cursoemvideo.com" target="_blank"
          >Curso em Video</a
        ></iframe
      >
      para aprender a programar.
    </p>
    <p>
      O repositório do professor Guanabara
      <iframe
        src="https://gustavoguanabara.github.io"
        frameborder="0"
        height="300"
        ><a href="https://gustavoguanabara.github.io" target="_blank"
          >Custavo Github</a
        ></iframe
      >
      está cheio de materiais interessantes
    </p>
  </body>
</html>
