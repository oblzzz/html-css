<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      * {
        font-family:
          montserrat,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-weight: 700;
        text-align: center;
        text-shadow: 3px 3px 3px rgba(0, 0, 0, 0.185);
      }
      div.container {
        /* background-color: slateblue; */
        background-image: linear-gradient(to top, rgb(79, 79, 244), blueviolet);
        margin-bottom: 1rem;
        padding: 1rem;
        display: flex;
        flex-flow: row nowrap;
      }

      .item {
        background-color: violet;
        border: 1px solid rgb(199, 7, 161);
        border-radius: 0.3rem;
        margin: 0.5rem;
        flex-basis: 200px;
        padding: 1rem;
        color: rgb(59, 255, 222);
        box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.2);
      }

      .container1 .item:nth-child(1) {
        flex-shrink: 0;
        flex-grow: 0;
      }

      .container1 .item:nth-child(2) {
        flex-shrink: 0;
        flex-grow: 0;
      }

      .container1 .item:nth-child(3) {
        flex-shrink: 0;
        flex-grow: 0;
      }
      /* -------------------------------------------------- */

      .container2 .item:nth-child(1) {
        flex-shrink: 0;
        flex-grow: 0;
      }

      .container2 .item:nth-child(2) {
        flex-shrink: 0;
        flex-grow: 2;
      }

      .container2 .item:nth-child(3) {
        flex-shrink: 0;
        flex-grow: 1;
      }

      /* -------------------------------------------------- */

      .container3 .item:nth-child(1) {
        flex-shrink: 1;
        flex-grow: 0;
      }

      .container3 .item:nth-child(2) {
        flex-shrink: 0;
        flex-grow: 0;
      }

      .container3 .item:nth-child(3) {
        flex-shrink: 2;
        flex-grow: 0;
      }

            /* -------------------------------------------------- */

      .container4 .item:nth-child(1) {
        flex-shrink: 1;
        flex-grow: 1;
      }

      .container4 .item:nth-child(2) {
        flex-shrink: 1;
        flex-grow: 1;
      }

      .container4 .item:nth-child(3) {
        flex-shrink: 1;
        flex-grow: 1;
      }


      .item:hover {
        background-color: rgb(233, 52, 112);
        border: 1px solid rgb(80, 255, 170);
        color: greenyellow;
        transition: 0.2s;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container container1">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
    </div>

    <div class="container container2">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
    </div>

    <div class="container container3">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
    </div>

    <div class="container container4">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
    </div>
  </body>
</html>
