<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: montserrat;
        }


        body{
            background-color:royalblue;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }

        main{
            background-color: violet;
            height: 90vh;
            width: 90vw;

            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.189);
        }

        section{
            background-color: palegreen;
            height: 12rem;
            width: 12rem;

            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.189);
        }

        h1{
            color: blueviolet;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 183, 0, 0.887), 0 0 10px rgba(255, 183, 0, 0.887), 0 0 10px rgba(255, 183, 0, 0.887);
        }

    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
    
</body>
</html>
