<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      * {
        font-family:
          montserrat,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-weight: 700;
        text-align: center;
        text-shadow: 3px 3px 3px rgba(0, 0, 0, 0.185);
      }

      h1 {
        color: deeppink;
        font-size: medium;
      }

      div.container1 {
        border-radius: 1rem;
        background-color: slateblue;
        height: 25rem;
        display: flex;
        flex-flow: row wrap;
        align-items: flex-start;
        margin: 1rem 0 1rem 0;
      }

      div.container2 {
        border-radius: 1rem;
        background-color: slateblue;
        /* padding: 1rem; */
        height: 18rem;
        display: flex;
        flex-flow: row wrap;
        justify-content: flex-end;
        align-items: flex-start;
        flex-wrap: wrap;
        margin: 1rem 0 1rem 0;
      }

      div.container3 {
        border-radius: 1rem;
        background-color: slateblue;
        /* padding: 1rem; */
        height: 18rem;
        display: flex;
        flex-flow: row wrap;
        align-items: center;
        justify-content: center;
        margin: 1rem 0 1rem 0;
      }

      div.container4 {
        border-radius: 1rem;
        background-color: slateblue;
        /* padding: 1rem; */
        height: 18rem;
        display: flex;
        flex-flow: row wrap;
        justify-content: space-between;
        align-items: flex-end;
        margin: 1rem 0 1rem 0;
      }

      div.container5 {
        border-radius: 1rem;
        background-color: slateblue;
        /* padding: 1rem; */
        height: 18rem;
        display: flex;
        flex-flow: row wrap;
        justify-content: space-evenly;
        margin: 1rem 0 1rem 0;
      }

      div.container6 {
        border-radius: 1rem;
        background-color: slateblue;
        /* padding: 1rem; */
        height: 18rem;
        display: flex;
        flex-flow: row wrap;
        justify-content: space-around;
        margin: 1rem 0 1rem 0;
      }

      div.item {
        background-color: violet;
        border: 1px solid rgb(199, 7, 161);
        border-radius: 0.3rem;
        margin: 0.2rem;
        /* flex: auto; */
        padding: 2rem;
        color: rgb(59, 255, 222);
        box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.2);
      }

      div.item:hover {
        background-color: rgb(233, 52, 112);
        outline: 5px solid rgb(80, 255, 170);
        color: rgb(17, 255, 0);
        transition: 0.1s;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>align-items: flex-start;</h1>
    <div class="container1">
      <div class="item">AXX</div>
      <div class="item">BXX</div>
      <div class="item">CXX</div>
      <div class="item">DXX</div>
      <div class="item">EXX</div>
      <div class="item">FXX</div>
      <div class="item">GXX</div>
    </div>

    <div class="container2">
      <div class="item">AXX</div>
      <div class="item">BXX</div>
      <div class="item">CXX</div>
      <div class="item">DXX</div>
      <div class="item">EXX</div>
      <div class="item">FXX</div>
      <div class="item">GXX</div>
    </div>

    <h1>Justify-content: center</h1>
    <div class="container3">
      <div class="item">AXX</div>
      <div class="item">BXX</div>
      <div class="item">CXX</div>
      <div class="item">DXX</div>
      <div class="item">EXX</div>
      <div class="item">FXX</div>
      <div class="item">GXX</div>
    </div>

    <h1>Justify-content: space-between</h1>
    <div class="container4">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
    </div>

    <h1>Justify-content: space-evenly</h1>
    <div class="container5">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
    </div>

    <h1>Justify-content: space-around</h1>
    <div class="container6">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
    </div>
  </body>
</html>
