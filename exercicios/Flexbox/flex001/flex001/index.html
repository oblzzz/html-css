<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            font-family: montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: 700;
            text-align: center;
            text-shadow: 3px 3px 3px rgba(0, 0, 0, 0.185);
        }
        div.container{
            background-color: slateblue;
            padding: 1rem;
            display: flex;

        }

        div.item{
            background-color: violet;
            border: 1px solid rgb(199, 7, 161);
            border-radius: .3rem;
            margin: .5rem;
            flex: auto;
            padding: 1rem;
            color: rgb(59, 255, 222);
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.2);
        }

        div.item:hover{
            background-color: rgb(233, 52, 112);
            border: 1px solid rgb(80, 255, 170);
            color: greenyellow;
            transition: .2s;
            cursor: pointer;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
