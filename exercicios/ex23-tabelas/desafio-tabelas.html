<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabelas</title>

    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            
        }

        table{
            border-collapse: collapse;
            width: 20rem;
        }
        
        td{
            border: 2px solid black;
            padding: 0.5rem;
            text-align: center;
        }
        tbody > tr:nth-child(odd){
            background-color: aquamarine;            
        }
    </style>

</head>
<body>
    <H1>TABELA 01</H1>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
            <!-- <td>7</td> -->
            <td>7</td>
        </tr>

        <tr>
            <td colspan="3">8</td>
            <!-- <td>10</td>
            <td>11</td> -->
            <td>9</td>
        </tr>

        <tr>
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <!-- <td>15</td> -->
            <td>12</td>
        </tr>

        <tr>
            <!-- <td>13</td> -->
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
        </table>

        <h1>TABELA 02</h1>

        <table>
            <tr>
                <td colspan="4">A</td>
                <!-- <td>B</td>
                <td>C</td>
                <td>D</td> -->
                <td rowspan="4">B</td>
            </tr>

            <tr>
                <td rowspan="4">C</td>
                <td>D</td>
                <td>E</td>
                <td>F</td>
                <!-- <td>J</td> -->
            </tr>

            <tr>
                <!-- <td>A</td> -->
                <td>G</td>
                <td>H</td>
                <td>I</td>
                <!-- <td>E</td> -->
            </tr>

            <tr>
                <!-- <td>A</td> -->
                <td>J</td>
                <td>L</td>
                <td>M</td>
                <!-- <td>E</td> -->
            </tr>

            <tr>
                <!-- <td>A</td>
                <td>B</td>
                <td>C</td>
                <td>D</td> -->
                <td colspan="4">N</td>
            </tr>

    </table>
    
</body>
</html>
