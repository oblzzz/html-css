<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meclagem de Celulas</title>
</head>
<style>
    body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 20rem;
        }
        
        td{
            border: 2px solid black;
            padding: 0.5rem;
            text-align: center;
        }

</style>
<body>
    <h1>Mescagem de Células</h1>
    
    <table>
        <tr>
            <td colspan="2">A</td>
            <!-- <TD>B</TD> -->
            <td>C</td>
        </tr>

        <tr>
            <td>D</td>
            <td rowspan="2">E</td>
            <td>F</td>
        </tr>

        <tr>
            <td>G</td>
            <!-- <td>H</td> -->
            <td rowspan="2">I</td>
        </tr>

        <tr>
            <td colspan="2">J</td>
            <!-- <td>K</td> -->
            <!-- <td>L</td> -->
        </tr>

    </table>
</body>
</html>
