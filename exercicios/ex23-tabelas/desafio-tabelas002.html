<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }

      table {
        border-collapse: collapse;
        width: 40rem;
        max-width: 100%;
      }

      td, th {
        border: 0.15rem solid black;
        padding: 0.6rem;
      }

      thead > tr > th {
        background-color: cadetblue;
        color: white;
      }

      caption {
        padding-bottom: 1.2rem;
        font-weight: bolder;
        font-size: larger;
      }

      .nota {
        text-align: center;
      }

      .destaque {
        background-color: cadetblue;
        color: white;
        text-align: center;
      }

      .destaque.normal {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1>Tabelas de Notas</h1>

    <table>
      <caption>
        NOTAS DOS CURSOS
      </caption>
      <thead>
        <tr>
          <th rowspan="2" scope="col">Área</th>
          <th rowspan="2" scope="col">Disciplina</th>
          <th colspan="2" scope="colgroup">Notas</th>
          <th rowspan="2" scope="col">Média</th>
        </tr>

        <tr>
          <th scope="col">Nota 1</th>
          <th scope="col">Nota 2</th>
        </tr>
      </thead>
      <tbody>
          <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Matemática</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
          </tr>
          <tr>
            <td>Física</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
          </tr>
          <tr>
            <td>Química</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
          </tr>
          <tr>
            <td>Biologia</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
          </tr>
          <tr>
            <th class="destaque normal" colspan="4" scope="row">Média de Exatas</th>
            <td class="destaque">0.0</td>
          </tr>
          <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>História</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
          </tr>
          <tr>
            <td>Geografia</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
            <td class="nota">0.0</td>
          </tr>
          <tr>
            <th class="destaque normal" colspan="4" scope="row">
              Média de Humanas
            </th>
            <td class="destaque">0.0</td>
          </tr>
      </tbody>
    </table>
  </body>
</html>
