<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario Checkbox</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas"><label for="isxmas">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfem"><label for="isxfem">Feminino</label><br>
            <input type="radio" name="sexo" id="isxnb"><label for="isxnb">Não Binário</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="iesfut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="iesbas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
            <input type="checkbox" name="iesnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
            <input type="checkbox" name="iesten" id="iesten"> <label for="iesten">Tênis</label> <br>
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
